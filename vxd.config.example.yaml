# Mirrors internal/config/loader.go DefaultConfig. Keep in sync — the
# doc_coverage test compares the structure of this example against the
# generated `vxd init` output.

version: "1.0"

workspace:
  state_dir: ~/.vxd
  backend: sqlite
  log_level: info
  log_retention_days: 30

models:
  tech_lead:
    provider: anthropic
    model: claude-opus-4-8
    max_tokens: 16000
  senior:
    provider: anthropic
    model: claude-opus-4-7
    max_tokens: 8000
  intermediate:
    provider: google
    model: gemma-4-27b-it
    max_tokens: 4000
  junior:
    provider: google
    model: gemma-4-27b-it
    max_tokens: 4000
  qa:
    provider: anthropic
    model: claude-opus-4-7
    max_tokens: 8000
  supervisor:
    provider: google
    model: gemma-4-27b-it
    max_tokens: 4000
  manager:
    provider: anthropic
    model: claude-opus-4-7
    max_tokens: 8000
  # Optional: dedicated model for the post-execution code reviewer.
  # Falls back to `senior` when omitted. The reviewer is never spawned as a
  # coding agent, so it may use `codex` (GPT-5.5 via subscription) even though
  # senior cannot. Codex auto-falls back to claude-opus-4-7 on failure.
  # reviewer:
  #   provider: codex
  #   model: gpt-5.5
  #   max_tokens: 8000

routing:
  junior_max_complexity: 3
  intermediate_max_complexity: 5
  max_retries_before_escalation: 2
  max_qa_failures_before_escalation: 3
  max_senior_retries: 2
  max_manager_attempts: 2
  max_concurrent_agents: 5

monitor:
  poll_interval_ms: 10000
  # 600s matches DefaultConfig — long enough for Sonnet/Opus to finish
  # multi-file reads without false-firing AGENT_STUCK. Lower (120-180s)
  # only when running fast models that should fail fast.
  stuck_threshold_s: 600
  context_freshness_tokens: 150000

cleanup:
  worktree_prune: immediate
  branch_retention_days: 7
  log_archive: dolt

merge:
  auto_merge: true
  base_branch: main
  pr_template: |
    ## Story: {story_id}
    {description}
    ### Acceptance Criteria
    {acceptance_criteria}

planning:
  sequential_file_patterns:
    - "package.json"
    - "*.config.*"
    - "src/core/*"
  max_story_complexity: 5
  godmode: false  # Set to true to skip permission prompts on CLI LLM calls
  design_approach: ddd-tdd  # ddd-tdd | tdd | standard

runtimes:
  claude-code:
    command: claude
    args: ["--dangerously-skip-permissions"]
    models: ["opus-4", "sonnet-4", "haiku-4"]
    detection:
      idle_pattern: "^\\$\\s*$"
      permission_pattern: "\\[Y/n\\]"
      plan_mode_pattern: "Plan mode"
  codex:
    command: codex
    args: ["--approval-mode", "full-auto"]
    models: ["o3", "o4-mini"]
    detection:
      idle_pattern: "Codex>"
      permission_pattern: "approve|deny"
  gemini:
    command: gemini
    args: ["--sandbox"]
    models: ["gemini-2.5-pro", "gemini-2.5-flash"]
    detection:
      idle_pattern: "gemini>"
      permission_pattern: "Allow|Deny"
