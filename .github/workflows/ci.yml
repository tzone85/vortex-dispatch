name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default: the workflow only needs to read the repo.
# The release job elevates to contents: write locally.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: go mod download

      - name: Install tmux (test dependency)
        run: sudo apt-get update -qq && sudo apt-get install -y tmux

      - name: Configure git defaults for tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@vortex-dispatch.local"
          git config --global user.name "VXD CI"
          # Tests create throwaway commits; never attempt to sign them so the
          # suite stays hermetic regardless of the runner's git config.
          git config --global commit.gpgsign false

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        # Full suite — every package, including internal/improve and
        # internal/cli (previously excluded for non-hermetic git/gh
        # dependencies, now fixed).
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # tech debt tracked in CLAUDE.md (nhooyr.io/websocket migration)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries
        run: |
          go build -o vxd ./cmd/vxd
          go build -o vxd-improve ./cmd/vxd-improve

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vxd-linux
          path: vxd

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    # Advisory for now: govulncheck releases can lag a brand-new Go language
    # version (go 1.26), so a tooling-version mismatch must not block CI. Flip
    # to required once govulncheck tracks the toolchain.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    # The release job is the only one that writes to the repo/releases.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
