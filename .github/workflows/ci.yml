name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: go mod download

      - name: Install tmux (test dependency)
        run: sudo apt-get update -qq && sudo apt-get install -y tmux

      - name: Configure git defaults for tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@vortex-dispatch.local"
          git config --global user.name "VXD CI"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        # -v emits per-test PASS/FAIL lines so the failing test name surfaces
        # when go test would otherwise just print "exit status 1\nFAIL pkg".
        # Verbose noise is the price of debuggability while we rebuild trust
        # in the cli + improve packages. Drop -v after a few green runs.
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          # Defensive: strip subscription/agent env vars that could divert a
          # local-only test path. CI runners don't have them, but make it
          # explicit so future env additions don't break the suite.
          ANTHROPIC_API_KEY: ""
          CLAUDECODE: ""

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # tech debt tracked in CLAUDE.md (nhooyr.io/websocket migration)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries
        run: |
          go build -o vxd ./cmd/vxd
          go build -o vxd-improve ./cmd/vxd-improve

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vxd-linux
          path: vxd

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
